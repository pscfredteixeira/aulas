name: Publicar Aulas no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/server/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: aulas-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Preparar Node.js somente no GitHub
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependências no servidor do GitHub
        run: npm install --no-audit --no-fund
      - name: Testar
        run: npm run test
      - name: Verificar permissoes no backend
        run: npm run test --prefix ../server
      - name: Conferir API do professor (quando configurada)
        env:
          AULAS_API_URL: ${{ vars.AULAS_API_URL || 'https://aulas-api-vrdo.onrender.com' }}
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 5 --max-time 90 "${AULAS_API_URL%/}/api/health" | grep -q '"ok":true'
      - name: Testar entrada de aluno na API pública
        env:
          AULAS_API_URL: ${{ vars.AULAS_API_URL || 'https://aulas-api-vrdo.onrender.com' }}
          AULAS_ORIGIN: https://pscfredteixeira.github.io
        run: node ../server/tests/live-smoke.mjs
      - name: Compilar site
        env:
          VITE_AULAS_API_URL: ${{ vars.AULAS_API_URL || 'https://aulas-api-vrdo.onrender.com' }}
        run: npm run build
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Enviar arquivos públicos
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
